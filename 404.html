<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Stranica nije pronađena | Brnas Ploče d.o.o.</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b1622">
  <link rel="icon" type="image/x-icon" href="assets/img/favicon.ico">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
  <style>
    .err-page {
      min-height: 100svh;
      display: grid;
      place-items: center;
      text-align: center;
      background: linear-gradient(160deg, var(--navy) 0%, var(--navy-2) 100%);
      color: #fff;
      padding: 2rem;
    }
    .err-code {
      font-family: var(--font-head);
      font-weight: 800;
      font-size: clamp(5rem, 22vw, 11rem);
      line-height: 1;
      letter-spacing: -0.04em;
      background: linear-gradient(120deg, #4cc4f0, #0a9bd6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .err-page h1 { color: #fff; font-size: clamp(1.4rem, 4vw, 2rem); margin-top: .5rem; }
    .err-page p { color: rgba(255,255,255,.7); margin: 1rem auto 2rem; max-width: 44ch; }
    .err-page img { width: 64px; height: 64px; border-radius: 16px; background:#fff; padding:7px; margin-inline:auto; }
  </style>
</head>

<body>
  <main class="err-page">
    <div>
      <img src="assets/img/logo.png" alt="Brnas Ploče logo" width="64" height="64">
      <div class="err-code">404</div>
      <h1>Stranica nije pronađena</h1>
      <p>Tražena stranica ne postoji ili je premještena. Vratite se na početnu stranicu.</p>
      <a class="btn btn--primary btn--lg" href="index.html">Natrag na početnu</a>
    </div>
  </main>
</body>
</html>
